name: Build, test, and package

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt
      - run: python -m pip install . -r requirements-test.txt
      - run: python -m pytest -q

  wheel:
    name: Build Python distribution
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify the installed wheel entry points
        run: python packaging/verify_bundle.py --wheel-dir dist
      - name: Include the installation guide
        run: python -c "from shutil import copyfile; copyfile('packaging/DOWNLOADS.md', 'dist/DOWNLOADS.md')"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-python
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  dashboard:
    name: Rust dashboard for ${{ matrix.platform }}
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            executable: security-dashboard.exe
          - os: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            executable: security-dashboard.exe
    env:
      RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-dashboard
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      DASHBOARD_PLATFORM: ${{ matrix.platform }}
      DASHBOARD_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: distribution-python
          path: wheel-artifact
      - name: Select the native Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - name: Test and build Rust
        run: |
          cargo test --locked --release --manifest-path rust-dashboard/Cargo.toml
          cargo build --locked --release --manifest-path rust-dashboard/Cargo.toml --bin security-dashboard
      - name: Verify installed Python and Rust interoperability
        shell: pwsh
        run: |
          $dashboard = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET\release\$env:DASHBOARD_EXECUTABLE"
          python packaging/verify_bundle.py --wheel-dir wheel-artifact --dashboard $dashboard
      - name: Package the dashboard
        shell: pwsh
        run: |
          $dashboard = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET\release\$env:DASHBOARD_EXECUTABLE"
          python packaging/package_dashboard.py $env:DASHBOARD_PLATFORM $dashboard release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-dashboard-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish versioned downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, wheel, dashboard]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: distribution-*
          merge-multiple: true
      - name: Publish verified artifacts with checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Set-Location assets
          $files = @(Get-ChildItem -File | Where-Object { $_.Name -match '\.(whl|zip)$' })
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Set-Content SHA256SUMS.txt
          $releaseFiles = @($files.FullName) + @((Resolve-Path DOWNLOADS.md).Path, (Resolve-Path SHA256SUMS.txt).Path)
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes -- $releaseFiles
