name: Build, test, and package

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python }} on Windows
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt
      - run: python -m pip install . -r requirements-test.txt
      - run: python -m pytest -q

  wheel:
    name: Build Python distribution
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify the installed wheel entry points
        run: python packaging/verify_bundle.py --wheel-dir dist
      - name: Include the installation guide
        run: python -c "from shutil import copyfile; copyfile('packaging/DOWNLOADS.md', 'dist/DOWNLOADS.md')"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-python
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  dashboard:
    name: Rust dashboard for ${{ matrix.platform }}
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            executable: security-dashboard.exe
          - os: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            executable: security-dashboard.exe
    env:
      RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-dashboard
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      DASHBOARD_PLATFORM: ${{ matrix.platform }}
      DASHBOARD_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: distribution-python
          path: wheel-artifact
      - name: Select the native Rust toolchain
        shell: pwsh
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - name: Test and build Rust
        run: |
          cargo test --locked --release --manifest-path rust-dashboard/Cargo.toml
          cargo build --locked --release --manifest-path rust-dashboard/Cargo.toml --bin security-dashboard
      - name: Verify installed Python and Rust interoperability
        shell: pwsh
        run: |
          $dashboard = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET\release\$env:DASHBOARD_EXECUTABLE"
          python packaging/verify_bundle.py --wheel-dir wheel-artifact --dashboard $dashboard
      - name: Package the dashboard
        shell: pwsh
        run: |
          $dashboard = Join-Path $env:CARGO_TARGET_DIR "$env:CARGO_BUILD_TARGET\release\$env:DASHBOARD_EXECUTABLE"
          python packaging/package_dashboard.py $env:DASHBOARD_PLATFORM $dashboard release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-dashboard-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish versioned downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, wheel, dashboard, offline-setup]
    runs-on: windows-2022
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: distribution-*
          merge-multiple: true
      - name: Publish verified artifacts with checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          Set-Location assets
          $files = @(Get-ChildItem -File | Where-Object { $_.Name -match '\.(whl|zip)$' })
          $hashes = $files | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          }
          $hashes | Set-Content SHA256SUMS.txt
          $releaseFiles = @($files.FullName) + @((Resolve-Path DOWNLOADS.md).Path, (Resolve-Path SHA256SUMS.txt).Path)
          gh release create $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --verify-tag --generate-notes -- $releaseFiles

  offline-setup:
    name: Verified Windows x64 all-in-one setup
    needs: [python-tests, dashboard]
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@v8
        with:
          name: distribution-dashboard-windows-x64
          path: dashboard-artifact
      - name: Stage detector and dependencies
        run: |
          $ErrorActionPreference = 'Stop'
          Expand-Archive dashboard-artifact/security-dashboard-windows-x64.zip staged-dashboard
          New-Item -ItemType Directory staged-model | Out-Null
          $origin = 'https://huggingface.co/Horizon-Labs/prompt-injection-guard-small/resolve'
          $revision = '2efc2ed5abecd21eb45c2506d231a65d6e392b85'
          foreach ($file in 'tokenizer.json', 'config.json', 'LICENSE', 'README.md') {
            Invoke-WebRequest "$origin/$revision/$file" -OutFile "staged-model/$file"
          }
          Invoke-WebRequest "$origin/$revision/onnx/model_quantized.onnx" -OutFile staged-model/model_quantized.onnx
          Invoke-WebRequest "$origin/main/NOTICE" -OutFile staged-model/NOTICE
          Copy-Item packaging/horizon_advisory_profile.json staged-model/advisory_profile.json
          python -m pip wheel --only-binary=:all: --wheel-dir staged-wheels '.[gateway]' 'onnxruntime==1.32.0' 'tokenizers==0.23.3' 'numpy==2.5.4'
      - name: Package and smoke-test offline setup
        run: |
          python packaging/package_offline_detector.py --model-dir staged-model --wheelhouse staged-wheels --dashboard staged-dashboard/security-dashboard-windows-x64/security-dashboard.exe --output all-in-one/Prompt-Security-All-in-One-Windows-x64.zip --python-version 3.14
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m zipfile -e all-in-one/Prompt-Security-All-in-One-Windows-x64.zip extracted-setup
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File extracted-setup/setup_detector.ps1 -Agent codex -Workspace (New-Item -ItemType Directory setup-test-workspace).FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path setup-test-workspace/.codex/hooks.json) -or -not (Test-Path extracted-setup/runtime_data/security_events.db)) {
            throw 'Setup did not create the hook and audit database.'
          }
          'UNINSTALL' | python extracted-setup/uninstall_detector.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hooksFile = 'setup-test-workspace/.codex/hooks.json'
          if ((Test-Path $hooksFile) -and ((Get-Content $hooksFile -Raw) -match 'security_middleware.agent_hooks')) {
            throw 'Uninstall left the installed hook enabled.'
          }
          if ((Test-Path extracted-setup/model/model_quantized.onnx) -or -not (Test-Path extracted-setup/runtime_data/security_events.db)) {
            throw 'Uninstall did not remove the model and preserve the audit database.'
          }
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-all-in-one-windows-x64
          path: all-in-one/Prompt-Security-All-in-One-Windows-x64.zip
          compression-level: 0
          if-no-files-found: error
