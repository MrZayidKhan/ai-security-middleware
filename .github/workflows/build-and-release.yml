name: Build, test, and package

on:
  pull_request:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt
      - run: python -m pip install . -r requirements-test.txt
      - run: python -m pytest -q

  wheel:
    name: Build Python distribution
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install build
      - run: python -m build
      - name: Verify the installed wheel entry points
        run: python packaging/verify_bundle.py --wheel-dir dist
      - name: Include the installation guide
        run: python -c "from shutil import copyfile; copyfile('packaging/DOWNLOADS.md', 'dist/DOWNLOADS.md')"
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-python
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  dashboard:
    name: Rust dashboard for ${{ matrix.platform }}
    needs: wheel
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            executable: security-dashboard.exe
          - os: windows-11-arm
            platform: windows-arm64
            target: aarch64-pc-windows-msvc
            executable: security-dashboard.exe
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            executable: security-dashboard
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            executable: security-dashboard
          - os: ubuntu-22.04
            platform: linux-x64
            target: x86_64-unknown-linux-gnu
            executable: security-dashboard
          - os: ubuntu-22.04-arm
            platform: linux-arm64
            target: aarch64-unknown-linux-gnu
            executable: security-dashboard
    env:
      RUSTUP_TOOLCHAIN: stable-${{ matrix.target }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/build-dashboard
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      CARGO_TARGET_AARCH64_PC_WINDOWS_MSVC_RUSTFLAGS: '-C target-feature=+crt-static'
      MACOSX_DEPLOYMENT_TARGET: '12.0'
      DASHBOARD_PLATFORM: ${{ matrix.platform }}
      DASHBOARD_EXECUTABLE: ${{ matrix.executable }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          name: distribution-python
          path: wheel-artifact
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev libx11-xcb-dev libxi-dev libxcursor-dev libxrandr-dev pkg-config
      - name: Select the native Rust toolchain
        shell: bash
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Test and build Rust
        run: |
          cargo test --locked --release --manifest-path rust-dashboard/Cargo.toml
          cargo build --locked --release --manifest-path rust-dashboard/Cargo.toml --bin security-dashboard
      - name: Verify installed Python and Rust interoperability
        shell: bash
        run: |
          python packaging/verify_bundle.py --wheel-dir wheel-artifact --dashboard "$CARGO_TARGET_DIR/$CARGO_BUILD_TARGET/release/$DASHBOARD_EXECUTABLE"
      - name: Package the dashboard
        shell: bash
        run: |
          python packaging/package_dashboard.py "$DASHBOARD_PLATFORM" "$CARGO_TARGET_DIR/$CARGO_BUILD_TARGET/release/$DASHBOARD_EXECUTABLE" release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: distribution-dashboard-${{ matrix.platform }}
          path: release-assets/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish versioned downloads
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [python-tests, wheel, dashboard]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: distribution-*
          merge-multiple: true
      - name: Publish verified artifacts with checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd assets
          files=(*.whl *.tar.gz *.zip)
          sha256sum -- "${files[@]}" > SHA256SUMS.txt
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes -- "${files[@]}" DOWNLOADS.md SHA256SUMS.txt
